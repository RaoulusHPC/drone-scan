[project]
name = "drone-scan"
version = "0.1.0"
description = "Local pipeline: drone or smartphone video -> 3D indoor model (Gaussian Splatting)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
# `drone-scan camera calibrate` (KAN-29); not installed in the worker image.
calibration = ["opencv-python-headless>=4.10"]

[project.scripts]
drone-scan = "dronescan.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "opencv-python-headless>=4.10", # same as the `calibration` extra, for the tests
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronescan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"] # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-p", "pytester"]
markers = [
    "gpu: needs CUDA, run via `make test-gpu` with DRONESCAN_VRAM_LIMIT_GB=5.0",
    "torch: needs PyTorch/gsplat; with `gpu` it runs in the worker-test container (make test-gpu)",
    "bench: slow benchmarks on reference rooms, not in CI",
    "sitl: needs ArduPilot SITL flight simulation",
]
