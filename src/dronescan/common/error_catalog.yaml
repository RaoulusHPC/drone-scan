# Single source of truth for all user-facing error codes (KAN-56, US-041).
# Read by dronescan.common.error_catalog (hints used by the code) and rendered into
# docs/fehlercodes.md (`python -m dronescan.common.error_catalog --write`).
#
# id          stable code "<scope>.<slug>", shown to the user and stored in manifest.json
# exit_code   0/1/2/10/20/30 (stage contract, docs/architektur.md section 5.2)
# scope       stage name or "common"/"capture"/"cli"
# cause       what went wrong (German, for the user)
# hints       remedies as shown to the user (static ones; stages may add dynamic ones)
# exceptions  exception classes that map to this code without carrying `code` themselves
codes:
  # --- common (all stages) -------------------------------------------------------------
  - id: common.unexpected
    exit_code: 1
    scope: common
    cause: Unerwarteter Fehler in einer Stufe (nicht vorhergesehener Programmfehler).
    hints:
      - >-
        Unerwarteter Fehler. Abhilfe: mit --force erneut ausführen; tritt er wieder auf,
        Log-Ausgabe und manifest.json an das Entwicklungsteam geben.
  - id: common.interrupted
    exit_code: 1
    scope: common
    cause: Abgebrochen (Strg+C bzw. Prozess beendet).
    hints:
      - "Abhilfe: Stufe erneut starten; bereits erzeugte Dateien werden neu berechnet."
  - id: common.scan_dir_missing
    exit_code: 10
    scope: common
    cause: Das mit --scan angegebene Scan-Verzeichnis existiert nicht.
    hints:
      - "Abhilfe: Pfad mit --scan prüfen bzw. den Scan zuerst anlegen."
  - id: common.input_missing
    exit_code: 10
    scope: common
    cause: Eine Eingabe der Stufe fehlt oder der Scan ist nicht lesbar (vorherige Stufe nicht gelaufen).
    hints:
      - >-
        Abhilfe: vorherige Stufe bzw. den Import für diesen Scan ausführen und den Pfad mit
        --scan prüfen.
    exceptions: [ScanError]
  - id: common.no_flight
    exit_code: 10
    scope: common
    cause: Der Scan enthält noch kein Video.
    hints:
      - "Abhilfe: Video importieren mit `drone-scan flight add <scan> <video>`."
  - id: common.outside_scan
    exit_code: 1
    scope: common
    cause: Eine Eingabe liegt außerhalb des Scan-Verzeichnisses.
    hints:
      - "Abhilfe: Dateien in das Scan-Verzeichnis importieren (Stufe 'import')."
  - id: common.write_failed
    exit_code: 1
    scope: common
    cause: Ergebnisse oder Einzelbilder konnten nicht geschrieben werden.
    hints:
      - "Abhilfe: freien Speicherplatz und Schreibrechte im Workspace prüfen."
  - id: common.gpu_oom
    exit_code: 30
    scope: common
    cause: Der Grafikspeicher (VRAM) hat nicht gereicht, auch nicht nach der automatischen Wiederholung mit kleineren Werten.
    hints:
      - >-
        Der Grafikspeicher hat nicht gereicht. Abhilfe: Profil 'low_vram_6gb' verwenden, andere
        GPU-Programme schließen oder ein kürzeres Video bzw. weniger Räume pro Scan verarbeiten.
    exceptions: [ColmapOutOfMemoryError]
  - id: common.ram_oom
    exit_code: 30
    scope: common
    cause: Der Arbeitsspeicher (RAM) hat nicht gereicht, oder der Kernel hat den Container beendet (Docker-Code 137).
    hints:
      - >-
        Der Arbeitsspeicher hat nicht gereicht. Abhilfe: andere Programme schließen oder ein
        kürzeres Video bzw. weniger Räume pro Scan verarbeiten.
  - id: common.gpu_unavailable
    exit_code: 1
    scope: common
    cause: Kein nutzbares PyTorch/CUDA (fehlende GPU-Abhängigkeiten, Treiber oder GPU).
    hints:
      - "Abhilfe: NVIDIA-Treiber prüfen (`nvidia-smi`); die Meldung nennt die konkrete Abhilfe."
    exceptions: [GpuUnavailableError]
  - id: common.gpu_lock_unusable
    exit_code: 1
    scope: common
    cause: Die GPU-Sperrdatei ist nicht nutzbar (Verzeichnis nicht beschreibbar).
    hints:
      - "Abhilfe: Verzeichnis prüfen oder DRONESCAN_GPU_LOCK_DIR setzen; die Meldung nennt Details."
    exceptions: [GpuLockError]
  - id: common.gpu_busy
    exit_code: 1
    scope: common
    cause: Eine andere GPU-Stufe hält die GPU-Sperre länger als gpu.lock_timeout_s (Profil, 1800 s). Ein vorhandenes Manifest wird dabei nicht verändert.
    hints:
      - >-
        Abhilfe: warten, bis die andere Stufe fertig ist (`docker ps`, `nvidia-smi`), und neu
        starten oder DRONESCAN_GPU__LOCK_TIMEOUT_S erhöhen.
    exceptions: [GpuBusyError]
  # --- ingest ----------------------------------------------------------------------------
  - id: ingest.ffmpeg_missing
    exit_code: 1
    scope: ingest
    cause: ffmpeg ist nicht installiert.
    hints:
      - "Abhilfe: ffmpeg installieren (z. B. `sudo apt install ffmpeg`)."
    exceptions: [FfmpegMissingError]
  - id: ingest.video_broken
    exit_code: 10
    scope: ingest
    cause: Das Video kann nicht (vollständig) dekodiert werden.
    hints:
      - >-
        Abhilfe: Video am Rechner abspielen und neu importieren, ggf. vorher neu exportieren
        (MP4/MOV mit H.264/H.265).
    exceptions: [FfmpegError]
  - id: ingest.too_few_frames
    exit_code: 20
    scope: ingest
    cause: Zu wenige verschiedene, scharfe Einzelbilder (Mindestzahl im Profil, ingest.min_keyframes).
    hints:
      - Kamera während der Aufnahme langsam und stetig durch den Raum bewegen (≤ 0,5 m/s).
      - "Länger aufnehmen: mindestens 30 Sekunden pro Raum."
      - Licht einschalten, damit die Bilder nicht verwackeln.
  - id: ingest.quality_red
    exit_code: 20
    scope: ingest
    cause: Die Gesamtampel aus Schärfe, Belichtung, Bewegung und Abdeckung steht auf Rot (Einzelbewertung je Flug in ingest/<flight_id>/quality.json).
    hints:
      - Die Hinweise der Meldung zu den roten Kriterien befolgen und neu aufnehmen.
  # --- sfm -------------------------------------------------------------------------------
  - id: sfm.frames_missing
    exit_code: 10
    scope: sfm
    cause: Die Einzelbilder fehlen, weil 'ingest' nicht erfolgreich gelaufen ist oder Dateien eines Flugs fehlen.
    hints:
      - >-
        Abhilfe: vorherige Stufe bzw. den Import für diesen Scan ausführen und den Pfad mit
        --scan prüfen.
  - id: sfm.image_unavailable
    exit_code: 1
    scope: sfm
    cause: Docker oder das COLMAP-Image fehlt, oder die GPU ist im Container nicht erreichbar.
    hints:
      - "Abhilfe: Docker starten und das Image bauen mit `docker compose build colmap`."
      - >-
        GPU im Container prüfen mit `make docker-check` (NVIDIA Container Toolkit, siehe
        README).
    exceptions: [ColmapUnavailableError]
  - id: sfm.colmap_failed
    exit_code: 1
    scope: sfm
    cause: COLMAP ist fehlgeschlagen oder antwortet nicht.
    hints:
      - "Abhilfe: Logdateien in sfm/colmap/logs/ prüfen und mit --force erneut ausführen."
    exceptions: [ColmapError, ColmapTimeoutError]
  - id: sfm.no_model
    exit_code: 20
    scope: sfm
    cause: Aus den Einzelbildern entstand kein 3D-Modell, oder weniger als 80 % der Einzelbilder liegen im größten Teilmodell (Messwerte unter metrics).
    hints:
      - Licht einschalten und möglichst bei Tageslicht aufnehmen.
      - Langsamer bewegen (≤ 0,5 m/s) und 1 bis 1,5 m Abstand zu den Wänden halten.
      - Türdurchgänge doppelt aufnehmen (hin und zurück).
      - Bei weißen Wänden, Glas oder Spiegeln 2 bis 4 AprilTags aufhängen.
  # --- recon -----------------------------------------------------------------------------
  - id: recon.sfm_missing
    exit_code: 10
    scope: recon
    cause: Die Kameraposen fehlen, weil 'sfm' nicht erfolgreich gelaufen ist.
    hints:
      - >-
        Abhilfe: vorherige Stufe bzw. den Import für diesen Scan ausführen und den Pfad mit
        --scan prüfen.
  - id: recon.image_unavailable
    exit_code: 1
    scope: recon
    cause: Docker oder das Worker- bzw. COLMAP-Image fehlt, oder die GPU ist im Container nicht erreichbar.
    hints:
      - "Abhilfe: Docker starten und die Images bauen mit `docker compose build worker colmap`."
      - >-
        GPU im Container prüfen mit `make docker-check` (NVIDIA Container Toolkit, siehe
        README).
    exceptions: [WorkerUnavailableError]
  - id: recon.prepare_failed
    exit_code: 1
    scope: recon
    cause: Entzerren, Bilder lesen oder Szene laden ist fehlgeschlagen, oder das Training schrieb keine Messwerte bzw. endete mit einem Fehler.
    hints:
      - "Abhilfe: Logdateien in recon/work/logs/ prüfen und mit --force erneut ausführen."
    exceptions: [SceneError]
  - id: recon.few_images
    exit_code: 20
    scope: recon
    cause: Weniger als zwei verortete Einzelbilder, zu wenig für das Training.
    hints:
      - "Mehr Einzelbilder aufnehmen: langsamer und länger filmen."
      - "Die Stufe 'sfm' muss mindestens zwei Einzelbilder verorten."
  - id: recon.train_timeout
    exit_code: 1
    scope: recon
    cause: Das Training wurde nach splat.timeout_s abgebrochen oder der Worker antwortet nicht.
    hints:
      - >-
        Abhilfe: andere GPU-Programme schließen; auf langsamen Rechnern
        DRONESCAN_SPLAT__TIMEOUT_S erhöhen oder DRONESCAN_SPLAT__MAX_ITERATIONS senken.
    exceptions: [WorkerError, WorkerTimeoutError]
  # --- compress (KAN-42) ----------------------------------------------------------------
  - id: compress.recon_missing
    exit_code: 10
    scope: compress
    cause: Die trainierte Szene fehlt (Stufe 'recon' nicht erfolgreich gelaufen).
    hints:
      - "Abhilfe: zuerst 'drone-scan recon --scan <scan>' ausführen."
  - id: compress.scene_unreadable
    exit_code: 1
    scope: compress
    cause: recon/splat/scene.ply ist beschädigt oder unvollständig.
    hints:
      - "Abhilfe: 'drone-scan recon --scan <scan> --force' ausführen und die Stufe wiederholen."
  - id: compress.empty
    exit_code: 20
    scope: compress
    cause: Nach dem Entfernen unsichtbarer Gaussians bleibt keine Szene übrig.
    hints:
      - "Den Raum neu aufnehmen: Licht an, langsam und vollständig filmen."
      - "Abhilfe bei bewusst sehr transparenten Szenen: compress.min_opacity im Profil senken."
  # --- capture (CLI commands that are not pipeline stages) -------------------------------
  - id: capture.scan_invalid
    exit_code: 10
    scope: capture
    cause: "`flight add`: Scan nicht angelegt, Video fehlt, ist defekt, hat keine Videospur oder ein nicht unterstütztes Format."
    hints:
      - "Abhilfe: Scan anlegen (`drone-scan scan create`), Pfad prüfen oder das Video neu exportieren."
    exceptions: [ScanError, ProbeError]
  - id: capture.camera_profile_invalid
    exit_code: 2
    scope: capture
    cause: Das Kameraprofil bei `flight add --camera` ist unbekannt, nicht lesbar oder ungültig.
    hints:
      - "Abhilfe: Name oder Pfad prüfen (`drone-scan camera list`) oder neu kalibrieren."
    exceptions: [CameraError]
  - id: capture.calibration_opencv_missing
    exit_code: 1
    scope: capture
    cause: Für `camera calibrate` fehlt OpenCV.
    hints:
      - >-
        Abhilfe: das optionale Paket installieren mit `uv sync --extra calibration` (bzw.
        `pip install 'drone-scan[calibration]'`).
  - id: capture.calibration_board_invalid
    exit_code: 1
    scope: capture
    cause: Ungültige Mustereinstellung (ChArUco ohne gültige --marker-mm, unbekanntes --dictionary).
    hints:
      - "Abhilfe: Markergröße messen und angeben bzw. ein Wörterbuch wie DICT_4X4_50 oder DICT_5X5_100 verwenden."
  - id: capture.calibration_ffmpeg_missing
    exit_code: 1
    scope: capture
    cause: ffmpeg/ffprobe ist nicht installiert.
    hints:
      - "Abhilfe: ffmpeg installieren (z. B. `sudo apt install ffmpeg`)."
  - id: capture.calibration_video_unreadable
    exit_code: 10
    scope: capture
    cause: Das Kalibriervideo fehlt oder ist nicht lesbar.
    hints:
      - "Abhilfe: Video prüfen oder neu exportieren (MP4/MOV mit H.264/H.265)."
  - id: capture.calibration_quality
    exit_code: 20
    scope: capture
    cause: Das Muster wurde in zu wenigen Bildern gefunden (calibration.min_views), die Kalibrierung ist nicht konvergiert oder der Restfehler ist zu groß (calibration.max_rms_error_px).
    hints:
      - Muster vollständig, scharf und gut beleuchtet filmen; die Kamera langsam bewegen.
      - >-
        Aus verschiedenen Winkeln und Abständen filmen, das Muster auch in die Bildecken und an
        die Bildränder bringen.
      - Muster flach auf eine feste Unterlage kleben (nicht gewellt).
      - >-
        Mustergröße prüfen: --cols und --rows zählen die Felder (Quadrate), nicht die inneren
        Ecken; bei ChArUco auch --dictionary prüfen.
  - id: capture.calibration_write_failed
    exit_code: 1
    scope: capture
    cause: Das Kameraprofil konnte nicht geschrieben werden.
    hints:
      - "Abhilfe: Zielordner und Schreibrechte prüfen oder mit --output einen anderen Pfad angeben."
  # --- models (drone-scan models pull/list, KAN-24) ---------------------------------------
  - id: models.lock_missing
    exit_code: 10
    scope: models
    cause: models.lock wurde nicht gefunden.
    hints:
      - "Abhilfe: im Repository-Verzeichnis ausführen oder den Pfad mit --lock bzw. DRONESCAN_MODELS_LOCK angeben."
  - id: models.lock_invalid
    exit_code: 1
    scope: models
    cause: models.lock ist nicht lesbar oder ungültig (jedes Modell braucht name, version, source, url, sha256, weights_license und code_license).
    hints:
      - "Abhilfe: die in der Meldung genannte Stelle in models.lock korrigieren."
  - id: models.unknown_name
    exit_code: 2
    scope: models
    cause: Der Modellname steht nicht in models.lock (es wird nichts geladen).
    hints:
      - "Abhilfe: nur gelistete Modelle laden; neue Einträge prüft der PO (Lizenz der Gewichte)."
  - id: models.hash_mismatch
    exit_code: 1
    scope: models
    cause: Die SHA-256 der heruntergeladenen Datei weicht von models.lock ab. Der Download wird verworfen und der Lauf bricht vor dem nächsten Modell ab.
    hints:
      - >-
        Abhilfe: später erneut versuchen; tritt es wieder auf, hat sich die Datei an der Quelle
        geändert und der Eintrag muss neu geprüft werden (PO, license-auditor).
  - id: models.download_failed
    exit_code: 1
    scope: models
    cause: Der Download ist fehlgeschlagen (HTTP-Fehler, keine Verbindung, größer als size_bytes oder Weiterleitung auf eine unsichere Adresse).
    hints:
      - "Abhilfe: Internetverbindung und Proxy prüfen, URL in models.lock prüfen, dann erneut `drone-scan models pull` ausführen."
    exceptions: [PullError]
  - id: models.write_failed
    exit_code: 1
    scope: models
    cause: Eine Datei im Modellverzeichnis ist nicht les- oder schreibbar.
    hints:
      - "Abhilfe: freien Speicherplatz und Schreibrechte prüfen (--models-dir bzw. DRONESCAN_MODELS_DIR)."
  - id: models.not_available
    exit_code: 10
    scope: models
    cause: Ein von einer Stufe benötigtes Modell steht nicht in models.lock, ist nicht heruntergeladen, nicht lesbar oder beschädigt.
    hints:
      - "Abhilfe: einmalig `drone-scan models pull <name>` ausführen (einziger Netzwerkzugriff)."
    exceptions: [ModelNotAvailableError]
  # --- cli -------------------------------------------------------------------------------
  - id: cli.config_invalid
    exit_code: 1
    scope: cli
    cause: Die Konfiguration (Profil plus Umgebungsvariablen DRONESCAN_*) enthält einen ungültigen Wert.
    hints:
      - "Abhilfe: den in der Meldung genannten Wert bzw. die Umgebungsvariable korrigieren."
  - id: cli.usage
    exit_code: 2
    scope: cli
    cause: Aufruffehler der CLI (unbekanntes Profil, fehlende oder ungültige Option, Zieldatei existiert).
    hints:
      - "Abhilfe: Aufruf mit `--help` prüfen."
    exceptions: [ProfileError]
