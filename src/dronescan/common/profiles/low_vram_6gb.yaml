# Standard profile for the target hardware: RTX 2060, 6 GiB (Q-2: peak <= 5.5 GiB per process).
# vram_limit_gb caps only the PyTorch allocator (GiB); the CUDA context (~0.3-0.5 GiB)
# comes on top, hence 5.0. Stage values are provisional and get calibrated in spike KAN-19.
vram_limit_gb: 5.0
gpu_device: 0 # nvidia-smi index, DRONESCAN_GPU_DEVICE overrides
gpu:
  allow_fp16: true # used only on sm_70+ (RTX 2060); Pascal stays fp32
  lock_timeout_s: 1800 # wait for a running GPU job this long (KAN-80), then exit 1
  lock_poll_s: 1
ingest: # start values from spike-01 (section 7)
  analysis_fps: 6
  analysis_edge_px: 480
  keyframes_per_s: 2
  min_rel_sharpness: 0.4
  similarity_edge_px: 64
  max_similarity: 0.99 # conservative: only (nearly) standing still counts as duplicate
  max_image_edge_px: 1600
  jpeg_qscale: 2
  min_keyframes: 3
  min_decoded_ratio: 0.9
  # Quality ampel (KAN-34, US-019), provisional, calibration open (spike-01/KAN-19):
  # ratios are relative to the already-decided keyframe windows (Reason), so they stay
  # meaningful across cameras; only the exposure values are absolute grey levels (0..255).
  blurry_warn_ratio: 0.2
  blurry_bad_ratio: 0.5
  duplicate_warn_ratio: 0.3
  duplicate_bad_ratio: 0.6
  min_coverage_ratio: 0.5
  target_coverage_ratio: 0.75
  exposure_dark_bad: 25
  exposure_dark_warn: 70
  exposure_bright_warn: 190
  exposure_bright_bad: 230
sfm: # values from spike-01 (sections 4, 5, 7), PO decision 2026-11-25 (KAN-36)
  max_image_edge_px: 1600
  max_num_features: 8192
  max_num_matches: 16384
  camera_model: SIMPLE_RADIAL
  exhaustive_max_keyframes: 250 # above: sequential matching with loop detection
  sequential_overlap: 10
  loop_vocab_words: 2048 # larger trees take minutes (4096 words, 2M descriptors: > 5 min)
  loop_vocab_iterations: 10
  loop_vocab_rounds: 1
  loop_vocab_max_descriptors: 200000
  loop_vocab_timeout_s: 300 # measured: 27 s for 300 images; hangs without features
  min_registration_ratio: 0.8 # below: exit 20
  target_registration_ratio: 0.9 # Q-3; below: warning
  oom_retry_image_edge_px: 1200
  oom_retry_num_features: 4096
  oom_retry_num_matches: 8192
calibration: # `drone-scan camera calibrate` (KAN-29), CPU only; provisional
  sample_fps: 2
  max_image_edge_px: 1920 # the profile is scaled to the keyframe size in `sfm`
  min_corners_per_view: 8
  min_views: 10
  max_views: 40 # evenly spread; calibration time grows with the views
  max_rms_error_px: 1.0
splat: # stage recon (KAN-41), values from spike-01 (sections 6, 7)
  strategy: mcmc
  max_iterations: 15000 # curve KAN-41 (165 frames, GTX 1060, 50 min): 3k 23.9, 7k 25.0, 10k 25.8, 12.5k 27.7, 15k 28.0 dB
  max_gaussians: 1500000 # measured: process peak 2.6-2.7 GiB incl. CUDA context (spike-01 6.2)
  max_image_edge_px: 1200 # 1600 px: +58 % time, no better quality
  sh_degree: 3
  holdout_every: 8
  overfit_warn_gap_db: 4.5
  oom_retry_max_gaussians: 750000
  oom_retry_image_edge_px: 960
  timeout_s: 14400
compress: # stage compress (KAN-42): SPZ for phones, CPU only
  max_gaussians: 1500000 # Q-7: <= 1.5 M Gaussians for >= 30 fps on mid-range Android
  min_opacity: 0.005 # below ~1/255: invisible after 8-bit alpha
  sh_degree: 1 # view-dependent colour of degree 1 only: smaller file, less GPU load on phones
search:
  detector_batch_size: 4
