# drone-scan containers (KAN-18). GPU jobs never run in parallel (CLAUDE.md rule 2).
# Start single jobs with `docker compose run --rm <service> ...`, NOT `docker compose up`:
# worker and colmap reserve the same GPU. The stage runner serializes GPU stages with an flock on
# workspace/.gpu.lock (KAN-80), which both services mount; keep ./workspace mounted in every
# GPU service. Both services are build-only for now.
# Default GPU: device 0 = GTX 1060 on the dev machine. The RTX 2070 SUPER (device 1) is
# reserved for another project: DRONESCAN_GPU_DEVICE=1 may only be set with the PO's prior
# consent for that run, and only if the card is free (`nvidia-smi`). Nothing enforces this here.
name: drone-scan

# `runtime: nvidia` (registered by `nvidia-ctk runtime configure`) is needed on some hosts, e.g.
# Ubuntu 26.04 with Docker 29 and the systemd cgroup driver: with the default runc runtime the
# container sees the GPU device files but NVML fails ("Failed to initialize NVML: Unknown Error").
x-gpu: &gpu
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${DRONESCAN_GPU_DEVICE:-0}"]
            capabilities: [gpu]

services:
  worker:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: drone-scan/worker:0.1.0
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      DRONESCAN_PROFILE: ${DRONESCAN_PROFILE:-low_vram_6gb}
      DRONESCAN_VRAM_LIMIT_GB: ${DRONESCAN_VRAM_LIMIT_GB:-5.0}
    volumes:
      - ./workspace:/workspace
      - ./data:/data:ro

  colmap:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/colmap.Dockerfile
    image: drone-scan/colmap:4.2.1
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - ./workspace:/workspace
