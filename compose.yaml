# drone-scan containers (KAN-18). GPU jobs never run in parallel (CLAUDE.md rule 2).
# Start single jobs with `docker compose run --rm <service> ...`, NOT `docker compose up`:
# worker and colmap reserve the same GPU. The stage runner serializes GPU stages with an flock on
# one gpu.lock per machine (KAN-80): the host directory below (default
# ~/.local/state/drone-scan, same as the host CLI; override with DRONESCAN_GPU_LOCK_DIR) is
# mounted into every GPU service and DRONESCAN_GPU__LOCK_FILE points at it. `make setup` creates
# the directory (docker would create a missing bind source as root). Both services are
# build-only for now.
# Default GPU: device 0 = GTX 1060 on the dev machine. The RTX 2070 SUPER (device 1) is
# reserved for another project: DRONESCAN_GPU_DEVICE=1 may only be set with the PO's prior
# consent for that run, and only if the card is free (`nvidia-smi`). Nothing enforces this here.
name: drone-scan

# `runtime: nvidia` (registered by `nvidia-ctk runtime configure`) is needed on some hosts, e.g.
# Ubuntu 26.04 with Docker 29 and the systemd cgroup driver: with the default runc runtime the
# container sees the GPU device files but NVML fails ("Failed to initialize NVML: Unknown Error").
x-gpu-lock-dir: &gpu-lock-dir ${DRONESCAN_GPU_LOCK_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/drone-scan}:/run/drone-scan-gpu

x-gpu: &gpu
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${DRONESCAN_GPU_DEVICE:-0}"]
            capabilities: [gpu]

services:
  worker:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: runtime # the last stage is `test` (worker-test below)
    image: drone-scan/worker:0.1.0
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      DRONESCAN_GPU__LOCK_FILE: /run/drone-scan-gpu/gpu.lock
      DRONESCAN_PROFILE: ${DRONESCAN_PROFILE:-low_vram_6gb}
      DRONESCAN_VRAM_LIMIT_GB: ${DRONESCAN_VRAM_LIMIT_GB:-5.0}
    volumes:
      - ./workspace:/workspace
      - ./data:/data:ro
      - *gpu-lock-dir

  colmap:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/colmap.Dockerfile
    image: drone-scan/colmap:4.2.1
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      DRONESCAN_GPU__LOCK_FILE: /run/drone-scan-gpu/gpu.lock
    volumes:
      - ./workspace:/workspace
      - *gpu-lock-dir

  # PyTorch GPU tests (`make test-gpu`, KAN-41): worker image plus pytest. The repository is
  # mounted read-only and tested from source; data/ and workspace/ are hidden (private
  # recordings never enter the test container). Build: `docker compose --profile test build`.
  worker-test:
    <<: *gpu
    profiles: [test]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: test
    image: drone-scan/worker-test:0.1.0
    network_mode: none
    working_dir: /repo
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      DRONESCAN_GPU__LOCK_FILE: /run/drone-scan-gpu/gpu.lock
      DRONESCAN_PROFILE: ${DRONESCAN_PROFILE:-low_vram_6gb}
      DRONESCAN_VRAM_LIMIT_GB: ${DRONESCAN_VRAM_LIMIT_GB:-5.0}
      PYTHONPATH: /repo/src:/repo
      DRONESCAN_TEST_REQUIRE_GPU: "1"
    tmpfs:
      - /repo/data
      - /repo/workspace
    volumes:
      - .:/repo:ro
      - *gpu-lock-dir
