# Backlog drone-scan – Quelle für docs/user-stories.md und den Jira-Import (Projekt „DRN“ (Schlüssel KAN))
# Felder: id (lokal, wird zu Jira-Key gemappt), title, as/want/so (Story), ac (Akzeptanzkriterien),
#         prio (Must/Should/Could), sp (Story Points), ms (Meilenstein), labels, deps (lokale IDs), type (Story/Task)

personas:
  - {id: P1, name: "Suchende (Privatnutzer)", desc: "Möchte verlegte Gegenstände schnell finden, kein Technikwissen."}
  - {id: P2, name: "Präsentierende (Makler/Verkäufer)", desc: "Will Immobilien virtuell zeigen, braucht ansprechende, datenschutzkonforme Ergebnisse."}
  - {id: P3, name: "Betrachtende (Interessent)", desc: "Öffnet eine Begehung per Link auf Smartphone/Laptop, ohne Installation."}
  - {id: P4, name: "Pilot", desc: "Fliegt die Drohne (oft identisch mit P1/P2), will sicher und einfach gute Aufnahmen machen."}
  - {id: P5, name: "Entwickler (PO + Claude Code)", desc: "Braucht reproduzierbare, testbare, lizenzsaubere Grundlagen."}

epics:
  - {id: EP-01, title: "Fundament & Entwicklungsumgebung", ms: m0}
  - {id: EP-02, title: "Erfassung & Import", ms: m1}
  - {id: EP-03, title: "Frame-Aufbereitung & Qualitätsprüfung", ms: m1}
  - {id: EP-04, title: "Rekonstruktion: Kameraposen, Maßstab, Zusammenführung", ms: m1}
  - {id: EP-05, title: "Virtuelle Begehung (Splat & Viewer)", ms: m1}
  - {id: EP-06, title: "Gegenstandssuche", ms: m2}
  - {id: EP-07, title: "Präsentation & Export für Verkaufsgespräche", ms: m4}
  - {id: EP-08, title: "Datenschutz & Datenhaltung", ms: m4}
  - {id: EP-09, title: "Web-App, Jobs & Bedienung", ms: m1}
  - {id: EP-10, title: "Flugunterstützung & Autonomie", ms: m5}
  - {id: EP-11, title: "Qualitätssicherung & Compliance", ms: m0}
  - {id: EP-12, title: "Hardware-Evaluierung & Erfassungsleitfaden", ms: m3}

stories:
  # ---------------- EP-01 Fundament ----------------
  - id: US-001
    epic: EP-01
    type: Task
    title: "Repo-Grundgerüst mit uv, Paketstruktur und Makefile"
    as: P5
    want: "ein Repository mit der in CLAUDE.md beschriebenen Struktur, uv-Projekt und Make-Zielen"
    so: "Claude Code und ich von Anfang an mit identischen Befehlen arbeiten"
    ac:
      - "Gegeben ein frischer Clone, wenn `make setup` läuft, dann sind Python-Umgebung (3.12, uv.lock) und pre-commit eingerichtet."
      - "`make check` läuft fehlerfrei (ruff, mypy --strict, pytest mit einem Platzhaltertest)."
      - "Paketstruktur `src/dronescan/{common,capture,ingest,sfm,recon,search,privacy,export,server}` existiert mit Typer-CLI `drone-scan --help`."
      - "`.gitignore` schließt `workspace/`, `data/` (außer `data/samples/`) und Modellgewichte aus."
    prio: Must
    sp: 3
    ms: m0
    labels: [infra, claude-code]
    deps: []
  - id: US-002
    epic: EP-01
    type: Task
    title: "CI-Pipeline (CPU) mit Lint, Typen, Tests"
    as: P5
    want: "dass jeder Push automatisch geprüft wird"
    so: "Fehler und Regelverstöße früh auffallen"
    ac:
      - "CI (GitHub Actions oder Bitbucket Pipelines) führt `make check` bei jedem Push und PR aus."
      - "Ein fehlschlagender Test oder Typfehler blockiert den Merge (Branch-Schutz dokumentiert)."
      - "Laufzeit der CI < 10 min."
    prio: Must
    sp: 2
    ms: m0
    labels: [infra, claude-code]
    deps: [US-001]
  - id: US-003
    epic: EP-01
    type: Task
    title: "Docker-Images für Worker (CUDA) und COLMAP"
    as: P5
    want: "reproduzierbare Container für GPU-Pipeline und COLMAP"
    so: "die Software auf jedem Ubuntu-Laptop mit NVIDIA-GPU gleich läuft"
    ac:
      - "`docker compose build` erzeugt Images `worker` (CUDA 12.6, PyTorch < 2.15 cu126, gsplat gebaut für sm_61 und sm_75) und `colmap` (CUDA-Architekturen 61;75)."
      - "`docker compose run worker python -c 'import torch; print(torch.cuda.get_device_capability())'` läuft auf der GTX 1060 (6, 1) ohne Kompatibilitätswarnung."
      - "README beschreibt Voraussetzungen (Treiber, NVIDIA Container Toolkit) inkl. Prüfbefehl."
    prio: Must
    sp: 5
    ms: m0
    labels: [infra]
    deps: [US-001]
  - id: US-004
    epic: EP-01
    type: Task
    title: "Spike: COLMAP + gsplat auf GTX 1060 (6-GiB-Budget) mit Smartphone-Video"
    as: P5
    want: "nachweisen, dass ein Raum aus einem Handyvideo auf der GTX 1060 im 6-GiB-Budget der RTX 2060 rekonstruierbar ist"
    so: "das Hauptrisiko (R-01, R-03) vor der Umsetzung bewertet ist"
    ac:
      - "3 Referenzräume (hell/texturiert, weiße Wände, Küche/Bad mit Spiegel) mit dem Smartphone aufgenommen; Verarbeitung auf der GTX 1060 mit 5,0-GiB-Allocator-Grenze (RTX 2070 SUPER nur nach Zustimmung des POs)."
      - "gsplat-Training auf Pascal (sm_61, fp32) nachgewiesen oder Fallback dokumentiert (ADR-0010, Risiko R-13)."
      - "Je Raum dokumentiert: registrierte Frames (%), Laufzeit je Stufe, Peak-VRAM, subjektive Qualität (Screenshots)."
      - "Ergebnisbericht `docs/spikes/spike-01.md` mit Empfehlung für Profilparameter `low_vram_6gb`."
    prio: Must
    sp: 5
    ms: m0
    labels: [spike, sfm, recon]
    deps: [US-003]
  - id: US-005
    epic: EP-01
    type: Task
    title: "Konfigurationssystem mit Profilen und VRAM-Limit"
    as: P5
    want: "zentrale Konfiguration mit Profilen `low_vram_6gb` und `default_8gb`"
    so: "alle Stufen dieselben Grenzwerte nutzen und der Zielrechner simulierbar ist"
    ac:
      - "Pydantic-Settings laden YAML-Profile; Werte per Umgebungsvariable überschreibbar."
      - "`DRONESCAN_VRAM_LIMIT_GB` setzt `torch.cuda.set_per_process_memory_fraction` beim Start jeder GPU-Stufe."
      - "Unit-Tests für Laden, Überschreiben und ungültige Werte."
    prio: Must
    sp: 3
    ms: m0
    labels: [infra, claude-code]
    deps: [US-001]
  - id: US-006
    epic: EP-01
    type: Task
    title: "Stufen-Framework: Manifest, Caching, Exitcodes"
    as: P5
    want: "eine gemeinsame Basisklasse für Pipeline-Stufen"
    so: "jede Stufe idempotent, nachvollziehbar und cachebar ist"
    ac:
      - "Basisklasse schreibt `manifest.json` (Input-Hashes, Parameter, Tool-Versionen, Zeit, peak_vram_mb, warnings, hints)."
      - "Bei unveränderten Eingaben und Parametern wird die Stufe übersprungen; `--force` erzwingt Neulauf."
      - "Exitcodes 0/10/20/30/1 sind implementiert und getestet; OOM wird als 30 erkannt."
    prio: Must
    sp: 5
    ms: m0
    labels: [infra, claude-code]
    deps: [US-005]
  - id: US-007
    epic: EP-01
    type: Task
    title: "Jira- und Claude-Code-Workflow einrichten"
    as: P5
    want: "Atlassian-MCP, Skills und Subagents funktionsfähig"
    so: "Stories mit `/story KAN-xx` durchgängig bearbeitet werden"
    ac:
      - "`.mcp.json` verbunden, `/mcp` authentifiziert; Claude Code kann eine KAN-Story lesen und kommentieren."
      - "Hook `block_real_flight.py` blockiert Testbefehl mit `--real-flight` nachweislich (Exit 2)."
      - "Board-Spalten und Labels gemäß docs/projektmanagement.md angelegt."
    prio: Must
    sp: 1
    ms: m0
    labels: [infra]
    deps: []

  # ---------------- EP-11 Qualitätssicherung & Compliance ----------------
  - id: US-008
    epic: EP-11
    type: Story
    title: "Lizenz-Gate in der CI"
    as: P5
    want: "dass nicht erlaubte Lizenzen automatisch erkannt werden"
    so: "das Produkt kommerziell nutzbar bleibt"
    ac:
      - "`licenses/allowlist.yaml` und `denylist.yaml` (u. a. Inria-3DGS, DUSt3R, MASt3R, SuperPoint-Gewichte) existieren."
      - "CI prüft Python- und npm-Abhängigkeiten sowie `models.lock`; eine NC-Lizenz erscheint im Report als `NC` (ADR-0012), unklare Lizenzen und Copyleft in der Laufzeit lassen den Build fehlschlagen (Q-8)."
      - "Copyleft-Pakete sind nur in Container-Images ohne Import aus `src/` erlaubt; Verstoß wird gemeldet."
    prio: Must
    sp: 3
    ms: m0
    labels: [compliance, claude-code]
    deps: [US-002]
  - id: US-009
    epic: EP-11
    type: Story
    title: "Modell-Registry `models.lock` und `drone-scan models pull`"
    as: P5
    want: "Modellgewichte versioniert, geprüft und einmalig herunterladen"
    so: "die Laufzeit offline bleibt und Lizenzen nachvollziehbar sind"
    ac:
      - "`models.lock` enthält je Modell Name, Version, Quelle, SHA-256, Code- und Gewichtelizenz."
      - "`drone-scan models pull` lädt nur gelistete Modelle und prüft die Hashes; Abweichung führt zu Abbruch."
      - "Zur Laufzeit erfolgt kein Netzwerkzugriff (Test mit blockiertem Netz)."
    prio: Must
    sp: 3
    ms: m1
    labels: [compliance]
    deps: [US-008]
  - id: US-010
    epic: EP-11
    type: Story
    title: "SBOM pro Release"
    as: P2
    want: "eine Software-Stückliste zu jedem Release"
    so: "ich Kunden und Partnern die Lizenzkonformität belegen kann"
    ac:
      - "Release-Job erzeugt SBOM im Format SPDX 2.3 (JSON) und CycloneDX."
      - "SBOM enthält auch Modellgewichte aus `models.lock` und Container-Basisimages."
    prio: Should
    sp: 2
    ms: m4
    labels: [compliance]
    deps: [US-008, US-009]
  - id: US-011
    epic: EP-11
    type: Story
    title: "Golden-Data-Smoketest und GPU-Testlauf mit VRAM-Grenze"
    as: P5
    want: "einen schnellen End-to-End-Test auf einem Kurzclip"
    so: "Regressionen in der Pipeline sofort sichtbar werden"
    ac:
      - "`make smoke` verarbeitet `data/samples/kurz.mp4` in < 2 min zu Kameraposen (ingest + sfm)."
      - "`make test-gpu` läuft mit 5,0-GiB-Allocator-Grenze auf der GTX 1060; Überschreitung lässt den Test fehlschlagen."
      - "Schwellwerte (registrierte Frames, Reprojektionsfehler) in `tests/golden/` versioniert."
    prio: Must
    sp: 3
    ms: m1
    labels: [infra, claude-code]
    deps: [US-006, US-021]
  - id: US-012
    epic: EP-11
    type: Story
    title: "Benchmark-Suite auf Referenzräumen"
    as: P5
    want: "Qualitätsmetriken (Q-1 bis Q-7) reproduzierbar messen"
    so: "Fortschritt und Regressionen objektiv bewertbar sind"
    ac:
      - "`make bench` misst Laufzeit, Peak-VRAM, registrierte Frames, Maßstabsfehler, PSNR/SSIM, Suchtreffer Top-3."
      - "Ergebnisse als CSV/Markdown-Bericht mit Vergleich zum letzten Lauf."
    prio: Should
    sp: 5
    ms: m2
    labels: [infra]
    deps: [US-011]

  - id: US-065
    epic: EP-01
    type: Story
    title: "GPU-Lock im Stufen-Runner: GPU-Jobs von worker und colmap serialisieren"
    as: P5
    want: "dass GPU-Stufen nie gleichzeitig laufen"
    so: "die Regel „GPU-Jobs laufen nie parallel“ (CLAUDE.md, Regel 2) technisch erzwungen ist und das 6-GiB-Budget hält"
    ac:
      - "Gegeben zwei GPU-Stufen werden gleichzeitig gestartet, wenn die erste läuft, dann wartet die zweite auf einen gemeinsamen Lock. Alternativ bricht sie mit einer verständlichen Meldung ab, die Abhilfe nennt."
      - "Der Lock funktioniert über Container-Grenzen hinweg, z. B. als Lock-Datei in einem gemeinsam gemounteten Verzeichnis, und wird bei einem Absturz freigegeben (kein Deadlock)."
      - "Der Stufen-Runner aus KAN-21 nutzt den Lock für alle Stufen mit GPU-Bedarf."
      - "Es gibt CPU-Tests für Lock, Warten und Freigabe nach Absturz."
    prio: Should
    sp: 3
    ms: m1
    labels: [infra]
    deps: [US-003, US-006]

  - id: US-066
    epic: EP-01
    type: Task
    title: "ffmpeg im Worker-Image, Image mit aktuellen Abhängigkeiten neu bauen"
    as: P5
    want: "`flight add` und `ingest` auch im Worker-Container ausführen"
    so: "die Pipeline nicht vom Host abhängt"
    ac:
      - "Das Laufzeit-Image `worker` enthält ffmpeg und ffprobe; `license-auditor` hat die Paketlizenz geprüft (externer Prozess, Image nur lokal)."
      - "Gegeben ein synthetisches Video, wenn `flight add` und `ingest` im Worker-Container laufen, dann entstehen dieselben Artefakte wie auf dem Host."
      - "Das Image baut mit dem aktuellen `uv.lock`; PyTorch bleibt auf cu126, `make docker-check` ist grün."
    prio: Could
    sp: 2
    ms: m1
    labels: [infra]
    deps: [US-003, US-018]

  # ---------------- EP-02 Erfassung & Import ----------------
  - id: US-013
    epic: EP-02
    type: Story
    title: "Scan anlegen und Videos importieren (CLI)"
    as: P4
    want: "einen Scan anlegen und ein oder mehrere Videos (je Akkuflug) hinzufügen"
    so: "alle Aufnahmen eines Gebäudes zusammen verarbeitet werden"
    ac:
      - "`drone-scan scan create <name>` legt `workspace/<id>/scan.yaml` an."
      - "`drone-scan flight add <scan> <video>` kopiert das Video, liest Metadaten (ffprobe: Auflösung, fps, Dauer, Codec, Rotation) und vergibt eine Flug-ID."
      - "Nicht unterstützte Formate oder defekte Dateien → Exit 10 mit verständlicher Meldung."
    prio: Must
    sp: 3
    ms: m1
    labels: [capture, claude-code]
    deps: [US-006]
  - id: US-014
    epic: EP-02
    type: Story
    title: "Kameraprofil und Intrinsik-Schätzung"
    as: P4
    want: "dass das System meine Kamera (Drohne/Handy/Action-Cam) passend behandelt"
    so: "die Rekonstruktion auch bei Weitwinkel/Fisheye gelingt"
    ac:
      - "Kameraprofile (YAML) mit Kameramodell (PINHOLE/OPENCV/OPENCV_FISHEYE); zunächst nur Smartphone. Drohnenprofile (DJI Neo 2, Tello, RunCam Thumb 2) folgen, sobald ein Gerät vorhanden ist (M3)."
      - "Ohne Profil: automatische Schätzung durch COLMAP, Ergebnis wird im Scan gespeichert."
      - "Optionaler Kalibrierbefehl mit Schachbrett-/ChArUco-Video."
    prio: Should
    sp: 3
    ms: m1
    labels: [capture, sfm]
    deps: [US-013]
  - id: US-015
    epic: EP-02
    type: Story
    title: "Upload über Smartphone-Browser"
    as: P4
    want: "Videos direkt vom Android-Smartphone hochladen"
    so: "ich keinen Kartenleser und keine Kommandozeile brauche"
    ac:
      - "Upload großer Dateien (≥ 4 GB) per Chunked Upload mit Fortschrittsanzeige und Fortsetzen nach Abbruch."
      - "Nach dem Upload erscheint der Flug im Scan mit Metadaten."
    prio: Must
    sp: 5
    ms: m1
    labels: [server, viewer]
    deps: [US-013, US-037]
  - id: US-016
    epic: EP-02
    type: Story
    title: "Telemetrie-Import (optional)"
    as: P4
    want: "vorhandene Flugtelemetrie (CSV, ArduPilot-Log, SRT-Untertitel) mit dem Video verknüpfen"
    so: "Höhe/Lage die Rekonstruktion stützen"
    ac:
      - "Import von DJI-SRT (falls vorhanden) und ArduPilot-DataFlash-Log; Zeitsynchronisation über Startzeit/Offset."
      - "Telemetrie ist optional; die Pipeline funktioniert ohne."
    prio: Could
    sp: 3
    ms: m3
    labels: [capture]
    deps: [US-013]
  - id: US-017
    epic: EP-02
    type: Story
    title: "Tello-Adapter (Aufnahme per Python)"
    as: P4
    want: "mit einer Tello per Laptop ein Video aufzeichnen"
    so: "ich günstig mit einer programmierbaren Drohne testen kann"
    ac:
      - "Adapter auf Basis djitellopy speichert Videostream lokal als MP4 mit Zeitstempeln."
      - "Steuerung bleibt manuell (App/Controller); der Adapter sendet keine Flugbefehle."
      - "Tests mit Mock-Stream (keine echte Drohne in der CI)."
    prio: Could
    sp: 3
    ms: m3
    labels: [capture, hardware]
    deps: [US-013]

  # ---------------- EP-03 Frame-Aufbereitung ----------------
  - id: US-018
    epic: EP-03
    type: Story
    title: "Frame-Extraktion mit Schärfe- und Duplikatfilter"
    as: P5
    want: "aus Videos automatisch scharfe, nicht redundante Keyframes"
    so: "SfM schneller und robuster läuft"
    ac:
      - "Dekodierung via ffmpeg (Rotation korrekt); Schärfe per Laplace-Varianz, adaptive Schwelle je Video."
      - "Duplikatfilter über Bildähnlichkeit/optischen Fluss; Zielabstand konfigurierbar (z. B. 2–4 Keyframes/s)."
      - "`frames.parquet` enthält je Frame Zeitstempel, Schärfe, Auswahlgrund."
    prio: Must
    sp: 5
    ms: m1
    labels: [ingest, claude-code]
    deps: [US-013]
  - id: US-019
    epic: EP-03
    type: Story
    title: "Qualitätsreport mit Handlungsempfehlungen"
    as: P4
    want: "nach dem Upload erfahren, ob meine Aufnahme gut genug ist"
    so: "ich bei Bedarf sofort nachfliegen kann"
    ac:
      - "`quality.json` bewertet Schärfe, Belichtung, Bewegungsgeschwindigkeit, Abdeckung (grob)."
      - "Bei ungenügender Qualität: Exit 20 und ≥ 1 konkreter Hinweis (z. B. „Licht einschalten“, „langsamer fliegen“) (Q-9)."
      - "`quality.json` je Flug und Gesamtampel je Scan (grün/gelb/rot) mit Hinweisen, CLI-Ausgabe; die Viewer-Darstellung folgt mit US-028."
    prio: Must
    sp: 3
    ms: m1
    labels: [ingest, viewer]
    deps: [US-018]
  - id: US-020
    epic: EP-03
    type: Story
    title: "Belichtungs- und Weißabgleichsnormalisierung"
    as: P2
    want: "gleichmäßige Farben in der Begehung"
    so: "die Präsentation professionell wirkt"
    ac:
      - "Optionale Normalisierung von Belichtung/Weißabgleich zwischen Flügen; vorher/nachher-Vergleich im Bericht."
      - "Kein negativer Einfluss auf die Registrierungsquote (Benchmark)."
    prio: Could
    sp: 3
    ms: m4
    labels: [ingest]
    deps: [US-018]

  # ---------------- EP-04 Rekonstruktion ----------------
  - id: US-021
    epic: EP-04
    type: Story
    title: "Kameraposen mit COLMAP (Stufe `sfm`)"
    as: P5
    want: "aus Keyframes Kameraposen und eine dünne Punktwolke"
    so: "Splat-Training und Suche darauf aufbauen können"
    ac:
      - "COLMAP-Adapter (Container) mit Feature-Extraktion, Matching (bis ca. 250 Keyframes erschöpfend, darüber sequenziell mit Loop-Detection; Grenze im Profil) und Mapper."
      - "Registrierungsquote und mittlerer Reprojektionsfehler im Manifest; < 80 % registriert → Exit 20 mit Hinweisen, 80 bis < 90 % → Warnung und Hinweise im Manifest."
      - "Läuft im Profil `low_vram_6gb` (Bildkante begrenzt)."
    prio: Must
    sp: 5
    ms: m1
    labels: [sfm, claude-code]
    deps: [US-018, US-003]
  - id: US-022
    epic: EP-04
    type: Story
    title: "AprilTag-Maßstab und Schwerkraftausrichtung"
    as: P2
    want: "dass das Modell in echten Metern vorliegt und gerade steht"
    so: "Maße und Grundriss stimmen"
    ac:
      - "Erkennung von AprilTags (tag36h11) mit konfigurierbarer Kantenlänge; Triangulation über mehrere Frames."
      - "Maßstabsfehler ≤ 3 % bei 2 Tags im Raum (Q-4), Boden horizontal ausgerichtet."
      - "Druckvorlage (PDF) für Tags im Repo."
    prio: Must
    sp: 5
    ms: m3
    labels: [sfm]
    deps: [US-021]
  - id: US-023
    epic: EP-04
    type: Story
    title: "Mehrere Flüge zu einem Modell zusammenführen"
    as: P4
    want: "dass mehrere Akkuflüge automatisch zu einem Gebäude zusammengesetzt werden"
    so: "auch größere Wohnungen erfasst werden können"
    ac:
      - "Flüge werden gemeinsam bzw. nacheinander registriert; gemeinsame Bereiche/Tags verbinden die Teilmodelle."
      - "Nicht verbindbare Flüge werden gemeldet mit Hinweis „Brückenflug durch Tür X“."
      - "Test mit 3 Flügen einer Referenzwohnung."
    prio: Must
    sp: 8
    ms: m3
    labels: [sfm]
    deps: [US-021, US-022]
  - id: US-024
    epic: EP-04
    type: Story
    title: "Alternative Feature-Matcher für texturarme Räume"
    as: P5
    want: "einen lizenzsauberen Fallback-Matcher (z. B. ALIKED + LightGlue)"
    so: "weiße Wände und schwierige Räume häufiger gelingen"
    ac:
      - "Lizenzprüfung durch `license-auditor` dokumentiert (keine SuperPoint-Gewichte)."
      - "Automatischer Fallback, wenn Registrierungsquote < 80 %; Vergleich im Benchmark."
    prio: Should
    sp: 5
    ms: m3
    labels: [sfm, compliance]
    deps: [US-021, US-012]
  - id: US-025
    epic: EP-04
    type: Story
    title: "Raumaufteilung (Chunking) für große Gebäude"
    as: P2
    want: "auch Häuser mit vielen Räumen auf 6 GB verarbeiten"
    so: "die Hardwaregrenze kein Ausschlusskriterium ist"
    ac:
      - "Aufteilung der Szene in räumliche Abschnitte mit Überlappung; Training je Abschnitt im VRAM-Budget."
      - "Zusammengesetzte Szene im Viewer ohne sichtbare Nähte an Abschnittsgrenzen (subjektiver Test + Screenshot)."
    prio: Should
    sp: 8
    ms: m3
    labels: [recon, sfm]
    deps: [US-026, US-023]

  # ---------------- EP-05 Begehung ----------------
  - id: US-026
    epic: EP-05
    type: Story
    title: "Gaussian-Splatting-Training im 6-GB-Profil (Stufe `recon.splat`)"
    as: P2
    want: "aus den Kameraposen eine fotorealistische 3D-Szene"
    so: "Interessenten die Räume virtuell begehen können"
    ac:
